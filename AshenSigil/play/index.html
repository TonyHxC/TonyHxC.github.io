<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Ashen Sigil</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #c9b48c;
	background-color: #0a0706;
	overflow: hidden;
	touch-action: none;
	font-family: 'IM Fell English', 'Iowan Old Style', Georgia, serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen ------------------------------------------------------------ */

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.1rem;
	visibility: hidden;
	background:
		radial-gradient(ellipse 55% 45% at 50% 52%, rgba(120, 52, 18, 0.28), transparent 70%),
		radial-gradient(ellipse at center, #15100c 0%, #0a0706 60%, #040302 100%);
	transition: opacity 0.9s ease;
	z-index: 1;
}

#status.leaving {
	opacity: 0;
}

#ash {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	pointer-events: none;
}

#title {
	position: relative;
	margin: 0;
	font-weight: 400;
	font-size: clamp(2.4rem, 7vw, 4.4rem);
	letter-spacing: 0.08em;
	color: #cdb78e;
	text-shadow: 0 0 18px rgba(200, 90, 30, 0.25), 0 2px 0 #000;
}

#subtitle {
	position: relative;
	margin: -0.9rem 0 0.2rem;
	font-style: italic;
	font-size: clamp(0.9rem, 2vw, 1.1rem);
	color: #a8452c;
	letter-spacing: 0.12em;
	text-shadow: 0 1px 0 #000;
}

#sheet {
	position: relative;
	width: min(62vw, 250px);
	height: auto;
	filter: drop-shadow(6px 12px 10px rgba(0, 0, 0, 0.7));
	animation: hover 4.4s ease-in-out infinite;
	transition: filter 0.6s ease;
}

@keyframes hover {
	0%, 100% { transform: translateY(0) rotate(-3deg); }
	50% { transform: translateY(-6px) rotate(-2deg); }
}

#sheet .ink {
	fill: none;
	stroke: #1d0d08;
	stroke-width: 3.2;
	stroke-linecap: round;
	stroke-linejoin: round;
	stroke-dasharray: 1 1;
	stroke-dashoffset: 1;
	transition: stroke 0.6s ease;
}

#sheet .bleed {
	stroke: rgba(40, 18, 10, 0.18);
	stroke-width: 7;
}

#sheet.inked .ink {
	stroke: #8a2e10;
}

#sheet.inked {
	filter: drop-shadow(6px 12px 10px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 14px rgba(255, 110, 30, 0.35));
}

#sheet.burning {
	animation: burn 1.1s ease-in forwards;
}

@keyframes burn {
	0% { transform: rotate(-3deg); filter: drop-shadow(0 0 16px rgba(255, 110, 30, 0.6)) brightness(1); }
	45% { filter: drop-shadow(0 0 22px rgba(255, 90, 20, 0.7)) brightness(0.55) sepia(0.8); }
	100% { transform: translateY(-24px) rotate(-6deg) scale(0.92); filter: brightness(0.05); opacity: 0; }
}

#status-line {
	position: relative;
	font-size: clamp(1rem, 2.4vw, 1.2rem);
	color: #b59e75;
	min-height: 1.4em;
}

#status-line .pct {
	color: #d8c39a;
}

#status-line .size {
	color: #6f6150;
	font-size: 0.85em;
	margin-left: 0.6em;
}

#lore {
	position: relative;
	font-style: italic;
	font-size: clamp(0.85rem, 1.9vw, 1rem);
	color: #7b6d5b;
	max-width: 32rem;
	padding: 0 1.5rem;
	text-align: center;
	min-height: 2.6em;
	transition: opacity 0.7s ease;
}

#status-notice {
	display: none;
	position: relative;
	max-width: 30rem;
	margin: 0 1.5rem;
	padding: 1rem 1.3rem;
	background: #2a1610;
	border: 1px solid #6b2a18;
	color: #d9c3a0;
	line-height: 1.4;
	text-align: center;
	box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.7);
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<canvas id="ash"></canvas>
			<h1 id="title">Ashen Sigil</h1>
			<div id="subtitle">the dead do not rest</div>

			<!-- The download is the sigil being inked: circle, then triangle, then the storm mark. -->
			<svg id="sheet" viewBox="0 0 220 270" aria-hidden="true">
				<defs>
					<filter id="torn" x="-5%" y="-5%" width="110%" height="110%">
						<feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
						<feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
					</filter>
					<filter id="stains">
						<feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="4" seed="3"/>
						<feColorMatrix values="0 0 0 0 0.32  0 0 0 0 0.2  0 0 0 0 0.08  0 0 0 -1.1 0.75"/>
					</filter>
					<radialGradient id="age" cx="50%" cy="45%" r="70%">
						<stop offset="55%" stop-color="#cdb98f"/>
						<stop offset="100%" stop-color="#8f7650"/>
					</radialGradient>
					<clipPath id="paper-clip">
						<rect x="12" y="12" width="196" height="246"/>
					</clipPath>
				</defs>
				<g filter="url(#torn)">
					<rect x="12" y="12" width="196" height="246" fill="url(#age)"/>
					<rect x="12" y="12" width="196" height="246" filter="url(#stains)" clip-path="url(#paper-clip)"/>
					<path d="M208 228 L178 258 L180 230 Z" fill="#a08a63" stroke="#5c4428" stroke-width="1"/>
				</g>
				<g transform="translate(110 128)">
					<path class="ink bleed" pathLength="1" id="p-circle-b" d="M0 -78 A78 78 0 1 1 -0.1 -78"/>
					<path class="ink" pathLength="1" id="p-circle" d="M0 -78 A78 78 0 1 1 -0.1 -78"/>
					<path class="ink bleed" pathLength="1" id="p-tri-b" d="M0 -62 L54 31 L-54 31 Z"/>
					<path class="ink" pathLength="1" id="p-tri" d="M0 -62 L54 31 L-54 31 Z"/>
					<path class="ink bleed" pathLength="1" id="p-zig-b" d="M-16 -16 L16 -16 L-16 16 L16 16"/>
					<path class="ink" pathLength="1" id="p-zig" d="M-16 -16 L16 -16 L-16 16 L16 16"/>
				</g>
			</svg>

			<div id="status-line">Preparing the ink…</div>
			<div id="lore"></div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":18924056,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusLine = document.getElementById('status-line');
	const statusNotice = document.getElementById('status-notice');
	const sheet = document.getElementById('sheet');
	const lore = document.getElementById('lore');

	// Each stroke inks over its share of the download.
	const strokes = [
		{ ids: ['p-circle', 'p-circle-b'], from: 0.0, to: 0.55 },
		{ ids: ['p-tri', 'p-tri-b'], from: 0.55, to: 0.85 },
		{ ids: ['p-zig', 'p-zig-b'], from: 0.85, to: 1.0 },
	].map((s) => ({ ...s, els: s.ids.map((id) => document.getElementById(id)) }));

	function inkTo(fraction) {
		for (const s of strokes) {
			const t = Math.min(Math.max((fraction - s.from) / (s.to - s.from), 0), 1);
			for (const el of s.els) {
				el.style.strokeDashoffset = String(1 - t);
			}
		}
	}

	// --- lore lines ---------------------------------------------------------
	const lines = [
		'Ink is cheaper than blood. Usually.',
		'Every sheet you burn is one you cannot write again.',
		'Draw true. A crooked sigil bites the hand that made it.',
		'The old yard keeps its dead poorly.',
		'Keep the lantern lit. They hate the light, but not enough.',
		'A circle for fire. A triangle to cast them back. A crooked line for the storm.',
	];
	let loreIndex = Math.floor(Math.random() * lines.length);
	function nextLore() {
		lore.style.opacity = '0';
		setTimeout(() => {
			lore.textContent = lines[loreIndex];
			loreIndex = (loreIndex + 1) % lines.length;
			lore.style.opacity = '1';
		}, 700);
	}
	nextLore();
	const loreTimer = setInterval(nextLore, 5200);

	// --- drifting ash -------------------------------------------------------
	const ash = document.getElementById('ash');
	const ctx = ash.getContext('2d');
	let flakes = [];
	let embers = false;
	let ashRunning = true;
	function resizeAsh() {
		ash.width = window.innerWidth;
		ash.height = window.innerHeight;
	}
	function makeFlake(top) {
		return {
			x: Math.random() * ash.width,
			y: top ? -10 : Math.random() * ash.height,
			s: 1 + Math.random() * 2.4,
			vy: 8 + Math.random() * 16,
			drift: Math.random() * Math.PI * 2,
			spin: Math.random() * Math.PI,
			ember: false,
		};
	}
	resizeAsh();
	window.addEventListener('resize', resizeAsh);
	for (let i = 0; i < 70; i++) {
		flakes.push(makeFlake(false));
	}
	let last = performance.now();
	function drawAsh(now) {
		if (!ashRunning) {
			return;
		}
		const dt = Math.min((now - last) / 1000, 0.05);
		last = now;
		ctx.clearRect(0, 0, ash.width, ash.height);
		for (const f of flakes) {
			f.drift += dt * 0.8;
			f.spin += dt * 1.5;
			f.y += (f.ember ? -f.vy * 3 : f.vy) * dt;
			f.x += Math.sin(f.drift) * 10 * dt;
			if (f.y > ash.height + 10) {
				Object.assign(f, makeFlake(true));
			}
			ctx.save();
			ctx.translate(f.x, f.y);
			ctx.rotate(f.spin);
			ctx.fillStyle = f.ember ? `rgba(255, ${120 + Math.floor(f.s * 30)}, 40, 0.85)` : 'rgba(90, 82, 76, 0.55)';
			ctx.fillRect(-f.s, -f.s * 0.6, f.s * 2, f.s * 1.2);
			ctx.restore();
		}
		requestAnimationFrame(drawAsh);
	}
	requestAnimationFrame(drawAsh);

	function burstEmbers() {
		const r = sheet.getBoundingClientRect();
		for (let i = 0; i < 90; i++) {
			flakes.push({
				x: r.left + Math.random() * r.width,
				y: r.top + r.height * (0.3 + Math.random() * 0.7),
				s: 1 + Math.random() * 2,
				vy: 10 + Math.random() * 25,
				drift: Math.random() * Math.PI * 2,
				spin: Math.random() * Math.PI,
				ember: Math.random() < 0.6,
			});
		}
	}

	// --- engine boot (from Godot's default shell) ----------------------------
	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			initializing = false;
			// The sigil takes, the sheet burns, the yard appears.
			sheet.classList.add('inked');
			statusLine.textContent = 'The sigil takes.';
			setTimeout(() => {
				sheet.classList.add('burning');
				burstEmbers();
			}, 450);
			setTimeout(() => statusOverlay.classList.add('leaving'), 1100);
			setTimeout(() => {
				ashRunning = false;
				clearInterval(loreTimer);
				statusOverlay.remove();
			}, 2100);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		statusLine.textContent = 'The ink would not take.';
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Your browser is missing features this game needs:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const f = current / total;
					inkTo(f);
					const mb = (n) => (n / 1048576).toFixed(1);
					if (f >= 1) {
						statusLine.textContent = 'Waking the dead…';
					} else {
						statusLine.innerHTML = `Inking the sigil <span class="pct">${Math.floor(f * 100)}%</span>`
							+ `<span class="size">${mb(current)} / ${mb(total)} MB</span>`;
					}
				} else {
					statusLine.textContent = 'Preparing the ink…';
				}
			},
		}).then(() => {
			inkTo(1);
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
